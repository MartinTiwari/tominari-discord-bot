name: Keepalive

# GitHub disables scheduled workflows on a repository that has seen no activity
# for 60 days. Nothing here pushes commits in normal use — the bot keeps its
# state in the Actions cache — so without this the Tominari schedule would go
# quiet after two months with no warning.
#
# One commit a month is enough to reset that clock.

on:
  schedule:
    - cron: '0 5 1 * *'   # 05:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record a heartbeat
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/last-heartbeat
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/last-heartbeat
          git commit -m 'chore: keepalive heartbeat' || exit 0
          git push
